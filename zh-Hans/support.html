<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Insight 支持。"><title>支持 — Insight</title><link rel="stylesheet" href="../styles.css"></head><body><header><a class="brand" href="index.html">✦ Insight</a><nav><a href="privacy.html">隐私</a><a href="terms.html">条款</a><a href="community-guidelines.html">社区</a><a href="support.html">支持</a></nav></header><main><h1>支持</h1><p class="lead">获取帮助最快的方式是 Insight 内的支持聊天。</p><div class="card"><h2>在应用中</h2><ol><li>打开<strong>个人资料</strong>。</li><li>点按<strong>设置</strong>。</li><li>选择<strong>支持聊天</strong>。</li><li>选择原因并描述问题。</li></ol><p>工单会等待分配，并保留对话记录。</p></div><h2>电子邮件支持</h2><p>如果无法访问应用，请联系 <a href="mailto:noam.durgnat.dev@gmail.com">noam.durgnat.dev@gmail.com</a>。请提供用户名、设备和清楚的问题说明。切勿发送 Apple 密码或认证代码。</p><h2>举报内容</h2><p>请使用帖子、评论和资料中的举报选项。举报将按<a href="community-guidelines.html">社区准则</a>审核。</p></main><footer>© 2026 Insight · <a href="index.html">首页</a> · <a href="privacy.html">隐私</a></footer></body></html>
